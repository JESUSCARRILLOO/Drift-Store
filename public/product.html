<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DRIFT — Detalle de producto</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <a href="index.html" class="logo">DRIFT</a>
  <nav><a href="index.html">← Volver a la colección</a></nav>
  <div class="topbar-actions">
    <button id="cart-toggle" class="cart-btn">🛒 <span id="cart-count">0</span></button>
  </div>
</header>

<section id="product-detail" class="product-detail"></section>

<aside id="cart-panel" class="cart-panel">
  <div class="cart-header">
    <h3>Tu carrito</h3>
    <div class="cart-header-actions">
      <button id="cart-clear" title="Vaciar carrito">🗑</button>
      <button id="cart-close">✕</button>
    </div>
  </div>
  <div id="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total">Total: <span id="cart-total">$0.00</span></div>
    <button id="checkout-btn" class="btn-primary" disabled>Pagar con Stripe</button>
    <p id="checkout-msg" class="checkout-msg"></p>
  </div>
</aside>
<div id="cart-overlay" class="cart-overlay"></div>

<script src="products.js"></script>
<script src="cart-store.js"></script>
<script src="cart-ui.js"></script>
<script src="product.js"></script>
</body>
</html>
